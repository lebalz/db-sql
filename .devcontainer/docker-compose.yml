services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: db
      DB_SQL_DATABASE_USER: db_sql
      DB_SQL_DATABASE_PASSWORD: db_sql
      REDIS_URL: redis://redis:6379/1

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: db_sql
      POSTGRES_PASSWORD: db_sql
      POSTGRES_DB: db_sql_development

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  postgres-data:
