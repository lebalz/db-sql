services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    depends_on:
      - postgres
      - selenium
      - redis
    environment:
      DB_HOST: postgres
      SELENIUM_HOST: selenium
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: db
      DB_SQL_DATABASE_USER: db_sql
      DB_SQL_DATABASE_PASSWORD: db_sql

  postgres:
    image: postgres:17.2
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: db_sql
      POSTGRES_PASSWORD: db_sql
      POSTGRES_DB: db_sql_development

  selenium:
    image: selenium/standalone-chromium
    environment:
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=800
      - SE_VNC_NO_PASSWORD=1
    ports:
      - 7900:7900

  redis:
    image: redis:8.2.2
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
